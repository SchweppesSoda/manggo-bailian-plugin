name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: manggo-bailian-plugin
          path: dist/*.mplugin
